# Gestionnaire de connexion de DuneI (L1-10) : connexion automatique une fois par démarrage, puis écran de connexion.
# Posé par DuneI depuis systeme/ — NE PAS MODIFIER À LA MAIN : make install le remplace ; le champ utilisateur y est rempli.
# Lu par greetd --config (surcharge greetd.service.d/10-dunei.conf) : le config.toml du paquet reste intact.
[terminal]
vt = 1

# Connexion automatique, jouée une seule fois par démarrage (fichier témoin /run/greetd.run) ; la session
# se verrouille dès sa première image (modules/demarrage.lua).
[initial_session]
user = "{utilisateur}"
command = "uwsm start -e -D Hyprland hyprland.desktop"

# Écran de connexion provisoire, après chaque sortie de session ; remplacé à L5-12. Le menu des sessions
# (F3) ne propose que DuneI (sessions/dunei.desktop), lancée par uwsm ; aucune session X11 n'est offerte :
# --xsessions désigne /etc/greetd/xsessions, volontairement inexistant. --no-config écarte tout
# /etc/tuigreet/config.toml de la machine. La commande libre (F2) reste ouverte :
# tuigreet 0.11.1 ne permet pas de la fermer ; c'est une saisie délibérée, close à L5-12.
# Même commande de session que ci-dessus (tests/test_greetd.py).
[default_session]
user = "greeter"
command = "tuigreet --no-config --time --sessions /etc/greetd/sessions --xsessions /etc/greetd/xsessions --cmd 'uwsm start -e -D Hyprland hyprland.desktop'"
