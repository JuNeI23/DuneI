# Contrôle de connectivité de NetworkManager, pour le panneau réseau (L2-11).
# Posé par DuneI depuis systeme/ — NE PAS MODIFIER À LA MAIN : make install le remplace.
# NetworkManager sonde lui-même l'accès à internet toutes les 30 s ; la coque ne l'interroge jamais
# périodiquement et lit seulement l'état qu'il publie. L'adresse sondée reste celle de la distribution.
[connectivity]
interval=30
