<?xml version="1.0"?>
<!-- GÉNÉRÉ depuis tokens.toml — NE PAS MODIFIER À LA MAIN -->
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Rendu : écran dense, niveaux de gris, hinting léger. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <!-- Familles génériques vers les noms canoniques. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Source Sans 3</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Source Code Pro</family></prefer>
  </alias>
  <!-- Noms canoniques vers les familles installées, puis la chaîne de repli. -->
  <alias binding="same">
    <family>Source Sans 3</family>
    <prefer><family>SourceSans3VF</family><family>Noto Sans</family><family>Noto Sans CJK JP</family><family>Noto Color Emoji</family><family>Noto Sans Symbols 2</family></prefer>
  </alias>
  <alias binding="same">
    <family>Source Code Pro</family>
    <prefer><family>SauceCodePro Nerd Font Mono</family><family>Noto Sans</family><family>Noto Sans CJK JP</family><family>Noto Color Emoji</family><family>Noto Sans Symbols 2</family></prefer>
  </alias>
</fontconfig>
