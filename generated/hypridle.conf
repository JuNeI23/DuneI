# hypridle.conf — échelle d'inactivité de DuneI (L1-09).
# GÉNÉRÉ depuis energie.toml par generate_energie.py — NE PAS MODIFIER À LA MAIN

general {
    lock_cmd = pidof hyprlock || hyprlock --no-fade-in
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    inhibit_sleep = 3
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# Batterie : écran atténué, clavier éteint à 150 s
listener {
    timeout = 150
    on-timeout = "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/dunei-attenuer" 10
    on-resume = "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/dunei-attenuer" --restaurer
    condition_cmd = "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/dunei-sur-batterie"
    condition_retry = 5
}

# Batterie : verrouillage à 300 s
listener {
    timeout = 300
    on-timeout = loginctl lock-session
    condition_cmd = "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/dunei-sur-batterie"
    condition_retry = 5
}

# Batterie : écran éteint à 330 s
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    condition_cmd = "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/dunei-sur-batterie"
    condition_retry = 5
}

# Batterie : mise en veille à 900 s
listener {
    timeout = 900
    on-timeout = systemctl suspend
    condition_cmd = "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/dunei-sur-batterie"
    condition_retry = 5
}

# Secteur : écran atténué, clavier éteint à 300 s
listener {
    timeout = 300
    on-timeout = "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/dunei-attenuer" 10
    on-resume = "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/dunei-attenuer" --restaurer
    condition_cmd = ! "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/dunei-sur-batterie"
    condition_retry = 5
}

# Secteur : verrouillage à 600 s
listener {
    timeout = 600
    on-timeout = loginctl lock-session
    condition_cmd = ! "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/dunei-sur-batterie"
    condition_retry = 5
}

# Secteur : écran éteint à 630 s
listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    condition_cmd = ! "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/dunei-sur-batterie"
    condition_retry = 5
}
