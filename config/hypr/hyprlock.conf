# Configuration de repli de dunei-verrou (L2-22) : lue au troisième lancement de hyprlock, quand la configuration
# produite par la coque (~/.local/state/dunei/verrou/hyprlock.conf) n'a pas tenu le verrou deux fois de suite.
# Volontairement sobre et sans image, pour ne dépendre d'aucun fichier produit : fond surface-base (thème nuit
# thématisé, #0f0703), horloge $TIME en texteClair (#f5f5f5), champ du mot de passe. Couleurs recopiées des jetons.
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

auth {
    fingerprint {
        enabled = false   # Empreinte : feature à part (L2-37).
    }
}

background {
    color = rgb(0f0703)
}

label {
    text = $TIME
    color = rgb(f5f5f5)
    font_family = Source Sans 3
    font_size = 96
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    position = 0, -60
    halign = center
    valign = center
}
