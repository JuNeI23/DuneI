# Configuration de secours de la voie B (L2-22) : lue par dunei-verrou quand hyprlock garde la session à la place de la
# coque, absente, muette, disparue ou en retard à l'échéance, et à l'ouverture de session, avant que la coque ne
# démarre et ne reprenne le verrou. Volontairement sobre et sans image, pour ne dépendre d'aucun fichier produit : fond
# surface-base (thème nuit thématisé, #0f0703), horloge $TIME et date française en texteClair (#f5f5f5), champ du mot
# de passe effacé tant qu'il est vide. Couleurs recopiées des jetons.
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

auth {
    fingerprint {
        enabled = false   # Empreinte : feature à part (L2-37).
    }
}

background {
    color = rgb(0f0703)
}

label {
    text = $TIME
    color = rgb(f5f5f5)
    font_family = Source Sans 3
    font_size = 96
    position = 0, 120
    halign = center
    valign = center
}

# Date longue, par exemple « mercredi 25 novembre », relue chaque minute : jour de la semaine (%w, 0 pour dimanche) et
# mois (%-m) traduits par awk, sans dépendre d'une locale française installée.
label {
    text = cmd[update:60000] date '+%w %-d %-m' | awk -v J='dimanche lundi mardi mercredi jeudi vendredi samedi' -v M='janvier février mars avril mai juin juillet août septembre octobre novembre décembre' '{split(J, a, " "); split(M, b, " "); print a[$1 + 1] " " $2 " " b[$3]}'
    color = rgb(f5f5f5)
    font_family = Source Sans 3
    font_size = 24
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    position = 0, -60
    halign = center
    valign = center
    fade_on_empty = true
}
