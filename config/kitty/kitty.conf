# Terminal provisoire de DuneI (L1-18) : kitty, conservé jusqu'à la grille de sélection de L3-11.
# Lié sous ~/.config/kitty/ par make install. Aucune couleur ni réglage esthétique : la palette arrive
# au lot 4, par un fichier généré depuis tokens.toml et inclus ici.

# Nom canonique : fonts.conf le mène à Source Code Pro Nerd Font Mono (L1-19).
font_family monospace
# Invites reconnues : saut d'une invite à l'autre, nouvelle fenêtre dans le même dossier.
shell_integration enabled
