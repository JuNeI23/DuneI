# Surcharge de hypridle.service pour DuneI (L1-09) : démon silencieux.
# Posé par DuneI depuis config/ — NE PAS MODIFIER À LA MAIN : make install le remplace.
# Sur secteur, les paliers de batterie retentent leur condition toutes les 5 s et journaliseraient
# environ 2 900 lignes par heure d'inactivité ; --quiet garde les erreurs et retire le reste.
# Pour déboguer : arrêter le service, puis lancer hypridle -v à la main.
[Service]
ExecStart=
ExecStart=/usr/bin/hypridle --quiet
